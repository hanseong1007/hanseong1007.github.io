<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b63">
<meta name="robots" content="noindex, nofollow">
<title>오프라인 · 경덕농수산 통합포털</title>
<style>
  :root{--brand:#0f7b63;--ink:#14231d;--muted:#77877f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;
       background:#f1f4f2;color:var(--ink);
       font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  .box{width:100%;max-width:380px;background:#fff;border:1px solid #e3e9e5;border-radius:20px;
       box-shadow:0 1px 2px rgba(16,32,22,.05),0 8px 24px rgba(16,32,22,.04);padding:24px;text-align:center}
  .bm{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:var(--brand);color:#fff;
      display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-1px}
  h1{margin:0 0 6px;font-size:18px;letter-spacing:-.4px}
  p{margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--muted)}
  button{width:100%;height:48px;border:0;border-radius:13px;background:var(--brand);color:#fff;
         font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  button:active{background:#0a5a48}
</style>
</head>
<body>
  <div class="box">
    <div class="bm">경덕</div>
    <h1>인터넷 연결이 끊겼습니다</h1>
    <p>와이파이나 데이터 연결을 확인한 뒤 다시 시도해 주세요.<br>연결되면 로그인 상태 그대로 이어서 쓰실 수 있습니다.</p>
    <button id="retry" type="button">다시 시도</button>
  </div>
<script>
  document.getElementById('retry').addEventListener('click', function(){
    location.replace('/');
  });
  window.addEventListener('online', function(){ location.replace('/'); });
</script>
</body>
</html>
